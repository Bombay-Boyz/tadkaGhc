# Drop this in as .github/workflows/ci.yml in Bombay-Boyz/tadka-ghc.
#
# Implements spec Phase 10's "two CI jobs" policy:
#   (a) full unit/property suite against the fake BuildRunner, on every
#       supported GHC in the matrix
#   (b) the narrow real-subprocess ioBuildRunner integration test, on the
#       newest supported GHC only, to keep CI time bounded
#
# GHC matrix corrected to match tadka-ghc's own README (9.10.3 / 9.12.4 /
# 9.14.1) and tadka's own minimum (>= 9.10.1) — NOT the spec's §15 draft,
# which still says 9.4.x/9.6.x/9.10.x/>=10.0. See the findings memo:
# 9.4.x and 9.6.x cannot work because `tadka` itself won't build there.
#
# tadka.git is already pinned via source-repository-package in
# cabal.project, so no extra setup is needed for that dependency here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, per spec §10's scheduled bounds-refresh job

jobs:
  build-and-test:
    name: build & test (fake BuildRunner) — GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.10.3", "9.12.4", "9.14.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.12"

      - name: cabal check
        run: cabal check

      - name: Configure
        run: cabal configure --enable-tests

      - name: cabal.project.freeze cache key
        run: cabal freeze

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Build
        # Re-passes -Werror explicitly as defence-in-depth against a local
        # cabal.project.local that might otherwise loosen it (spec §10).
        run: cabal build all --ghc-options="-Werror"

      - name: Test (fake BuildRunner suite; excludes the real-subprocess tag)
        run: cabal test all --test-options="--pattern=\$0 !~ /real-subprocess/"

  hlint:
    name: hlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/"]'
          # Non-blocking on style-only suggestions, blocking on correctness/
          # partiality hints, per spec §10. Adjust the ignore list in
          # .hlint.yaml as those categories are identified; this flag alone
          # doesn't implement the split, it just runs hlint — the failure
          # policy has to live in .hlint.yaml's severity overrides.
          fail-on: warning

  real-subprocess-integration:
    name: real ioBuildRunner integration (newest supported GHC only)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.12"

      - name: Build
        run: cabal build all --ghc-options="-Werror"

      - name: Real-subprocess integration test only
        # Runs only the tagged, narrow test that spawns a real cabal/stack +
        # GHC against a tiny scratch project (spec §9.4), per Phase 10's
        # policy of keeping this off the full matrix to bound CI time.
        run: cabal test all --test-options="--pattern=real-subprocess"

  package-bounds-refresh:
    name: package bounds refresh (scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.12"
      - name: Attempt build against latest releases of every dependency
        run: |
          cabal update
          cabal build all --allow-newer
        continue-on-error: true
        id: latest-build
      - name: Report failure
        if: steps.latest-build.outcome == 'failure'
        run: |
          echo "::warning::A dependency's latest release breaks the build against relaxed bounds. Open an issue per spec §10's package-bounds policy."
